<!DOCTYPE html>
<html lang="pt-BR">
  <head>
        <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = `
          <div style="color: white; padding: 20px; font-family: sans-serif; background: #290E1F; min-height: 100vh; box-sizing: border-box;">
            <h3 style="color: #FE7802;">Ocorreu um erro no App:</h3>
            <p style="font-size: 14px; word-break: break-all;"><b>${message}</b></p>
            <p style="font-size: 12px; color: #aaa;">Local: ${source} (Linha: ${lineno})</p>
            <pre style="font-size: 11px; color: #ff9999; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; overflow-x: auto;">${error ? error.stack : 'Sem detalhes'}</pre>
          </div>
        `;
      };
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RevisaFlash</title>

    <!-- ========================================================== -->
    <!-- MANIFEST DO PWA (obrigatório para o ícone na tela inicial) -->
    <!-- ========================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ========================================================== -->
    <!-- ÍCONES PARA DISPOSITIVOS MÓVEIS                            -->
    <!-- ========================================================== -->
    <!-- Ícone para dispositivos Apple (iOS) -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- Favicon padrão (aparece na aba do navegador) -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- ========================================================== -->
    <!-- CORES DO TEMA (para a barra de navegação do navegador)     -->
    <!-- ========================================================== -->
    <meta name="theme-color" content="#290E1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RevisaFlash" />

    <!-- ========================================================== -->
    <!-- DESCRIÇÃO E METADADOS (SEO)                               -->
    <!-- ========================================================== -->
    <meta name="description" content="Plataforma de estudos com flashcards, banco de erros, plano de estudos e revisões programadas." />
    <meta name="keywords" content="flashcards, estudos, residência médica, concursos, revisão, plano de estudos" />
    <meta name="author" content="RevisaFlash" />

    <!-- ========================================================== -->
    <!-- OPEN GRAPH (para compartilhamento em redes sociais)        -->
    <!-- ========================================================== -->
    <meta property="og:title" content="RevisaFlash" />
    <meta property="og:description" content="Estude com flashcards, gerencie erros e acompanhe seu progresso." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- ========================================================== -->
    <!-- TWEET CARD (para compartilhamento no Twitter/X)           -->
    <!-- ========================================================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RevisaFlash" />
    <meta name="twitter:description" content="Estude com flashcards, gerencie erros e acompanhe seu progresso." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
